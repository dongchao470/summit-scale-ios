name: SummitScale
options:
  bundleIdPrefix: com.dongchao470
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  SummitScale:
    type: application
    platform: iOS
    sources:
      - path: SummitScale/Sources
      - path: SummitScale/Resources
        excludes:
          - "Info.plist"
          - "SummitScale.entitlements"
    settings:
      base:
        PRODUCT_NAME: SummitScale
        PRODUCT_BUNDLE_IDENTIFIER: com.dongchao470.summit-scale
        MARKETING_VERSION: "0.3.4"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SummitScale/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SummitScale/SummitScale.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    info:
      path: SummitScale/Resources/Info.plist
      properties:
        CFBundleDisplayName: 山与秤
        CFBundleName: SummitScale
        CFBundleShortVersionString: "0.3.4"
        CFBundleVersion: "7"
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities:
          - arm64
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHealthShareUsageDescription: 读取「健康」里的体重记录，导入本机做趋势和热量换算，数据只在你的手机上处理。
