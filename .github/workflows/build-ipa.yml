name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          set -x
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          xcode-select -p

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || true
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            curl -sSL -o /tmp/xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen-dist
            sudo mkdir -p /usr/local/bin
            sudo cp /tmp/xcodegen-dist/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
            sudo chmod +x /usr/local/bin/xcodegen
          fi
          xcodegen --version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SummitScale.xcodeproj \
            -scheme SummitScale \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build | tail -n 120

      - name: Inject entitlements (optional)
        continue-on-error: true
        run: |
          set -x
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          ENT="SummitScale/SummitScale.entitlements"
          echo "APP=$APP"
          echo "ENT=$ENT"
          test -f "$ENT"
          # 先试 ldid（社区脚本常用写法：-S 紧跟文件名），失败再用 codesign 做 ad-hoc 签名
          (brew install ldid >/dev/null 2>&1 && ldid -S"$ENT" "$APP/SummitScale") || echo "ldid 路径失败"
          codesign --force --sign - --entitlements "$ENT" "$APP/SummitScale" || echo "codesign 失败"
          echo "--- 注入结果 ---"
          codesign -d --entitlements - "$APP/SummitScale" 2>&1 || true
          ldid -e "$APP/SummitScale" 2>&1 || true

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "APP=$APP"
          test -d "$APP"
          rm -rf Payload SummitScale-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          echo "--- Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          echo "--- binary ---"
          file "$APP/SummitScale" || true
          lipo -info "$APP/SummitScale" || true
          echo "--- size ---"
          du -sh "$APP"
          zip -qry SummitScale-0.2.0-unsigned.ipa Payload
          ls -lh SummitScale-0.2.0-unsigned.ipa
          shasum -a 256 SummitScale-0.2.0-unsigned.ipa | tee SummitScale-0.2.0-unsigned.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SummitScale-ipa
          path: |
            SummitScale-0.2.0-unsigned.ipa
            SummitScale-0.2.0-unsigned.sha256
          if-no-files-found: error
          retention-days: 30
